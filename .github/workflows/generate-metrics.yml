name: Update language chart

on:
  schedule:
    - cron: "23 04 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build language chart from GitHub repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: LucioZampella
        run: node scripts/generate-language-chart.mjs

      - name: Commit refreshed chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-languages.svg assets/github-overview.svg assets/language-data.json
          git diff --cached --quiet || git commit -m "chore: update profile charts [skip ci]"
          git push
